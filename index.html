<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrotherHood</title>
<meta name="description" content="BrotherHood on Robinhood Chain." />
<link rel="icon" href="assets/favicon.png" />
<meta property="og:title" content="BrotherHood" />
<meta property="og:description" content="BrotherHood on Robinhood Chain." />
<meta property="og:image" content="assets/brotherhood.jpg" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --lime:#c8fa0b;
    --ink:#0b1200;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--lime);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:0;
    width:100%;
  }

  .logo{
    width:min(62vh,680px,90vw);
    aspect-ratio:1/1;
    display:block;
    object-fit:contain;
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }

  h1{
    margin-top:8px;
    font-size:min(9vw,120px);
    font-weight:900;
    letter-spacing:-.05em;
    line-height:1;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .sub{
    margin-top:12px;
    font-weight:700;
    font-size:min(2.2vw,16px);
    letter-spacing:.3em;
    text-transform:uppercase;
    opacity:.7;
  }

  .links{display:flex;justify-content:center;gap:14px;margin-top:30px}
  .links a{
    text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
    min-width:150px;
    padding:16px 36px;border-radius:999px;
    background:var(--ink);color:var(--lime);
    font-weight:900;font-size:16px;letter-spacing:.12em;text-transform:uppercase;
    transition:transform .12s ease;
  }
  .links a:hover{transform:translateY(-2px)}
  .links a.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}

  .ca{
    margin-top:18px;
    display:inline-flex;align-items:center;gap:14px;
    background:rgba(11,18,0,.08);
    border:2px solid rgba(11,18,0,.3);
    border-radius:999px;padding:12px 22px;
    cursor:pointer;max-width:92vw;
    transition:background .15s ease,border-color .15s ease;
  }
  .ca:hover{background:rgba(11,18,0,.14);border-color:rgba(11,18,0,.5)}
  .ca .label{font-weight:900;font-size:11px;letter-spacing:.2em;opacity:.65}
  .ca .value{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ca .copy-state{font-weight:900;font-size:11px;letter-spacing:.14em}

  @media(max-width:640px){
    body{padding:24px 18px}
    .logo{width:min(50vh,86vw)}
    h1{font-size:min(13vw,64px)}
    .sub{font-size:11px;letter-spacing:.22em}
    .links{gap:10px;margin-top:22px}
    .links a{min-width:120px;padding:14px 26px;font-size:14px}
    .ca{padding:10px 16px;gap:10px}
    .ca .value{font-size:11px}
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="assets/brotherhood.jpg" alt="BrotherHood" />
    <h1>BrotherHood</h1>
    <div class="sub">On Robinhood Chain</div>

    <nav class="links">
      <a href="#" id="buy" target="_blank" rel="noopener">Buy</a>
      <a class="ghost" href="#" id="x" target="_blank" rel="noopener">X</a>
    </nav>

    <div class="ca" id="ca" title="Click to copy">
      <span class="label">CA</span>
      <span class="value" id="ca-value">TBA</span>
      <span class="copy-state" id="ca-state"></span>
    </div>
  </main>

<script>
  var ca = document.getElementById('ca');
  var val = document.getElementById('ca-value');
  var state = document.getElementById('ca-state');
  ca.addEventListener('click', function(){
    var t = val.textContent.trim();
    if (t === 'TBA') return;
    navigator.clipboard.writeText(t).then(function(){
      state.textContent = 'COPIED';
      setTimeout(function(){ state.textContent = ''; }, 1400);
    });
  });
</script>
</body>
</html>
